name: build-usage-fix
on:
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test protocol
        working-directory: desktop-tauri/src-tauri
        run: cargo test -p agent2api-server --release protocol::anthropic 2>&1 | tail -30
      - name: build amd64 image
        run: |
          docker build -t agent2api-usagefix:3.1.0 .
          docker save agent2api-usagefix:3.1.0 | gzip > image.tar.gz
          sha256sum image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: agent2api-usagefix-image
          path: image.tar.gz
          retention-days: 3
